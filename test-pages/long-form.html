<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Comprehensive Engineering Application</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 840px; margin: 40px auto; padding: 0 20px; background: #f8fafc; color: #1e293b; }
    .card { background: white; padding: 36px; border-radius: 12px; border: 1px solid #e2e8f0; }
    h1 { font-size: 24px; font-weight: 800; margin-bottom: 4px; }
    .section-head { font-size: 16px; font-weight: 700; margin: 24px 0 14px 0; border-bottom: 2px solid #0284c7; padding-bottom: 6px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .form-group { margin-bottom: 14px; }
    label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 4px; color: #334155; }
    input, textarea, select { width: 100%; padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13px; box-sizing: border-box; }
    .btn-submit { background: #0284c7; color: white; border: none; padding: 12px 28px; border-radius: 8px; font-weight: 700; font-size: 14px; cursor: pointer; margin-top: 16px; }
    .back { display: inline-block; margin-bottom: 16px; color: #0284c7; text-decoration: none; font-size: 13px; font-weight: 600; }
  </style>
</head>
<body>
  <a href="./index.html" class="back">&larr; Back to Test Suite</a>

  <div class="card">
    <h1>Senior Software Engineer Application</h1>
    <p style="color:#64748b; font-size:14px; margin-bottom:24px;">Datadog &bull; Cloud Infrastructure &bull; Remote</p>

    <form onsubmit="event.preventDefault(); alert('Manual Form Submission Triggered!');">
      <!-- Personal Info -->
      <div class="section-head">1. Personal Information</div>
      <div class="grid-2">
        <div class="form-group">
          <label>First Name</label>
          <input type="text" name="first_name" placeholder="First Name">
        </div>
        <div class="form-group">
          <label>Last Name</label>
          <input type="text" name="last_name" placeholder="Last Name">
        </div>
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" name="email" placeholder="email@example.com">
        </div>
        <div class="form-group">
          <label>Phone Number</label>
          <input type="tel" name="phone" placeholder="+91 ...">
        </div>
        <div class="form-group">
          <label>Current City</label>
          <input type="text" name="city" placeholder="Bangalore">
        </div>
        <div class="form-group">
          <label>State / Province</label>
          <input type="text" name="state" placeholder="Karnataka">
        </div>
        <div class="form-group">
          <label>Country</label>
          <input type="text" name="country" placeholder="India">
        </div>
        <div class="form-group">
          <label>Pincode / Postal Code</label>
          <input type="text" name="pincode" placeholder="560066">
        </div>
      </div>

      <!-- Links -->
      <div class="section-head">2. Online Profiles</div>
      <div class="grid-2">
        <div class="form-group">
          <label>LinkedIn Profile</label>
          <input type="url" name="linkedin" placeholder="LinkedIn URL">
        </div>
        <div class="form-group">
          <label>GitHub Profile</label>
          <input type="url" name="github" placeholder="GitHub URL">
        </div>
        <div class="form-group" style="grid-column: span 2;">
          <label>Portfolio Link</label>
          <input type="url" name="portfolio" placeholder="Portfolio website">
        </div>
      </div>

      <!-- Education -->
      <div class="section-head">3. Education Records</div>
      <div class="grid-2">
        <div class="form-group">
          <label>Highest Degree</label>
          <input type="text" name="degree" placeholder="Master of Computer Applications">
        </div>
        <div class="form-group">
          <label>Field of Study / Branch</label>
          <input type="text" name="branch" placeholder="Computer Science">
        </div>
        <div class="form-group">
          <label>University / Institution</label>
          <input type="text" name="university" placeholder="Jain University">
        </div>
        <div class="form-group">
          <label>Expected Graduation Year</label>
          <input type="text" name="graduation_year" placeholder="2027">
        </div>
      </div>

      <!-- Work Authorization & Preferences -->
      <div class="section-head">4. Work Authorization & Availability</div>
      <div class="grid-2">
        <div class="form-group">
          <label>Are you legally authorized to work in India?</label>
          <input type="text" name="auth_india" placeholder="Yes / No">
        </div>
        <div class="form-group">
          <label>Are you legally authorized to work in the United States?</label>
          <input type="text" name="auth_us" placeholder="Yes / No">
        </div>
        <div class="form-group">
          <label>Will you require visa sponsorship in the US?</label>
          <input type="text" name="sponsorship_us" placeholder="Yes / No">
        </div>
        <div class="form-group">
          <label>Notice Period</label>
          <input type="text" name="notice_period" placeholder="15 days">
        </div>
      </div>

      <button type="submit" class="btn-submit">Submit Application</button>
    </form>
  </div>
</body>
</html>
